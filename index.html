        function processImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            let cleanUrl = url.trim();

            if (!cleanUrl) return '';

            if (cleanUrl.startsWith('data:image/')) {
                return cleanUrl;
            }

            if (cleanUrl.includes('drive.google.com') && cleanUrl.includes('/file/d/')) {
                const idMatch = cleanUrl.match(/\/file\/d\/([^\/]+)/);
                if (idMatch && idMatch[1]) {
                    cleanUrl = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }
            }

            if (cleanUrl.includes('dropbox.com')) {
                cleanUrl = cleanUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
            }

            if (cleanUrl.startsWith('http://')) {
                cleanUrl = cleanUrl.replace('http://', 'https://');
            }

            return cleanUrl;
        }

        function ProductImage({ src, alt, className }) {
            const [imgState, setImgState] = useState('loading');
            const [currentSrc, setCurrentSrc] = useState('');

            useEffect(() => {
                const processed = processImageUrl(src);
                if (!processed) {
                    setImgState('empty');
                    return;
                }
                setCurrentSrc(processed);
                setImgState('loading');
            }, [src]);

            const handleError = () => {
                if (imgState === 'loading' && currentSrc && !currentSrc.startsWith('data:')) {
                    const rawUrl = currentSrc.replace(/^https?:\/\//, '');
                    setCurrentSrc(`https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}`);
                    setImgState('proxy');
                } else {
                    setImgState('error');
                }
            };

            if (imgState === 'empty' || imgState === 'error') {
                return (
                    <div className={`flex items-center justify-center bg-slate-900 text-slate-500 ${className}`}>
                        <i data-lucide="package" className="w-8 h-8 opacity-60"></i>
                    </div>
                );
            }

            return (
                <img 
                    src={currentSrc} 
                    alt={alt || "Foto Produk"} 
                    className={`${className} object-cover`}
                    onLoad={() => setImgState('success')}
                    onError={handleError}
                />
            );
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio AudioContext error:", e);
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCk2xwtT9BGIEm520yJqfkSTDED1mOmt4M",

        const db = new Dexie("VeloPOSProDB");

            products: 'id, name, barcode, sku, category, costPrice, sellingPrice, stock, minStock, expiredDate, totalSold, lastSoldDate, imageUrl',

        function resetLocalDatabase() {
            try { db.close(); } catch (e) {}
            return new Promise((resolve, reject) => {
                const req = indexedDB.deleteDatabase("VeloPOSProDB");
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
                req.onblocked = () => resolve();
            });
        }

        async function handleDbError(error, context) {
            console.error(`Database Error (${context}):`, error);
            if (error && error.name === 'VersionError') {
                const confirmReset = confirm(
                    "Penyimpanan lokal browser Anda berisi data dari versi aplikasi yang tidak kompatibel (VersionError).\n\n" +
                    "Klik OK untuk MERESET penyimpanan lokal di perangkat ini (data produk/transaksi lama akan terhapus) lalu memuat ulang aplikasi.\n" +
                    "Klik Cancel untuk membatalkan."
                );
                if (confirmReset) {
                    try {
                        await resetLocalDatabase();
                        window.location.reload();
                    } catch (resetError) {
                        alert("❌ Gagal mereset database: " + resetError.message);
                    }
                }
                return true;
            }
            return false;
        }

        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [storeInfo, setStoreInfo] = useState({});
            
            const [isBackingUp, setIsBackingUp] = useState(false);
            const [lastBackupTime, setLastBackupTime] = useState(localStorage.getItem('last_backup_time') || null);

            const [datePreset, setDatePreset] = useState('ALL');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            const [cart, setCart] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [isVisualScanOpen, setIsVisualScanOpen] = useState(false);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiDetectedName, setAiDetectedName] = useState('');
            
            const visualVideoRef = useRef(null);
            const visualStreamRef = useRef(null);
            const html5QrCodeRef = useRef(null);
            const aiModelRef = useRef(null);

            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('CASH');
            const [cashPaid, setCashPaid] = useState('');
            const [cashierInput, setCashierInput] = useState('');
            const [customerInput, setCustomerInput] = useState('');
            const [lastCompletedTx, setLastCompletedTx] = useState(null);
            const [isReceiptModalOpen, setIsReceiptModalOpen] = useState(false);

            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [imageInputMode, setImageInputMode] = useState('file');
            const [newCategoryInput, setNewCategoryInput] = useState('');
            const [isAddingNewCategory, setIsAddingNewCategory] = useState(false);
            const [productForm, setProductForm] = useState({
                id: '',
                name: '',
                sku: '',
                barcode: '',
                category: 'Makanan',
                costPrice: 0,
                sellingPrice: 0,
                stock: 0,
                minStock: 5,
                expiredDate: '',
                imageUrl: ''
            });

            const salesChartRef = useRef(null);
            const topProductsChartRef = useRef(null);
            const chartInstanceRef = useRef({});

            useEffect(() => {
                initSampleData().then(async () => {
                    await refreshData();
                    
                    firebaseDb.ref('pos_backup').on('value', async (snapshot) => {
                        const remoteData = snapshot.val();
                        if (remoteData) {
                            try {
                                if (remoteData.products && Array.isArray(remoteData.products)) {
                                    await db.products.clear();
                                    await db.products.bulkPut(remoteData.products);
                                }
                                if (remoteData.categories && Array.isArray(remoteData.categories)) {
                                    await db.categories.clear();
                                    await db.categories.bulkPut(remoteData.categories);
                                }
                                if (remoteData.transactions && Array.isArray(remoteData.transactions)) {
                                    await db.transactions.clear();
                                    await db.transactions.bulkPut(remoteData.transactions);
                                }
                                if (remoteData.settings) {
                                    await db.settings.put({ ...remoteData.settings, id: 'store_info' });
                                }
                                await refreshData();
                            } catch (err) {
                                console.error("Sync error:", err);
                            }
                        }
                    });
                }).catch(async (error) => {
                    const handled = await handleDbError(error, 'inisialisasi awal');
                    if (!handled) {
                        alert("❌ Gagal membuka database lokal (IndexedDB): " + error.message + "\n\nCoba buka aplikasi ini di tab browser normal (bukan mode Incognito/Private) dan pastikan penyimpanan browser tidak diblokir.");
                    }
                });
            }, []);

            const refreshData = async () => {
                const p = await db.products.toArray();
                const c = await db.categories.toArray();
                const t = await db.transactions.toArray();
                const s = await db.settings.get('store_info');
                setProducts(p);
                setCategories(c);
                setTransactions(t);
                if (s) setStoreInfo(s);
            };

            const handleBackupToFirebase = async () => {
                setIsBackingUp(true);
                try {
                    const allProducts = await db.products.toArray();
                    const allCategories = await db.categories.toArray();
                    const allTransactions = await db.transactions.toArray();
                    const storeSetting = await db.settings.get('store_info');

                    const backupData = {
                        products: allProducts,
                        categories: allCategories,
                        transactions: allTransactions,
                        settings: storeSetting || {},
                        updatedAt: new Date().toISOString()
                    };

                    await firebaseDb.ref('pos_backup').set(backupData);

                    const nowStr = new Date().toLocaleString('id-ID');
                    setLastBackupTime(nowStr);
                    localStorage.setItem('last_backup_time', nowStr);

                    alert("✅ Berhasil! Seluruh data transaksi & produk telah disinkronkan ke Firebase Cloud (fpos-8da84).");
                } catch (error) {
                    console.error("Backup Error:", error);
                    alert("❌ Gagal sinkronisasi ke Firebase: " + error.message);
                } finally {
                    setIsBackingUp(false);
                }
            };

            useEffect(() => {
                if (isScannerOpen) {
                    setTimeout(() => {
                        const readerElem = document.getElementById("reader");
                        if (!readerElem) return;

                        const html5QrCode = new Html5Qrcode("reader");
                        html5QrCodeRef.current = html5QrCode;

                        html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 15, qrbox: { width: 250, height: 150 } },
                            (decodedText) => {
                                playBeepSound();
                                const found = products.find(p => p.barcode === decodedText || p.sku === decodedText);
                                if (found) {
                                    addToCart(found);
                                    setIsScannerOpen(false);
                                } else {
                                    alert(`Barcode "${decodedText}" terdeteksi, namun produk tidak ditemukan di database!`);
                                    setIsScannerOpen(false);
                                }
                            },
                            () => {}
                        ).catch(err => {
                            console.error("Gagal membuka kamera barcode:", err);
                            alert("Kamera tidak dapat diakses atau tidak diizinkan oleh browser!");
                            setIsScannerOpen(false);
                        });
                    }, 300);
                } else {
                    if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
                        html5QrCodeRef.current.stop().then(() => {
                            html5QrCodeRef.current.clear();
                        }).catch(e => console.log(e));
                    }
                }

                return () => {
                    if (html5QrCodeRef.current && html5QrCodeRef.current.isScanning) {
                        html5QrCodeRef.current.stop().catch(e => console.log(e));
                    }
                };
            }, [isScannerOpen, products]);

            useEffect(() => {
                if (isVisualScanOpen) {
                    setAiDetectedName('');
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                        .then(stream => {
                            visualStreamRef.current = stream;
                            if (visualVideoRef.current) {
                                visualVideoRef.current.srcObject = stream;
                            }
                        })
                        .catch(err => {
                            console.error("Gagal mengaktifkan kamera visual scan:", err);
                            alert("Izin kamera ditolak atau perangkat kamera tidak ditemukan!");
                            setIsVisualScanOpen(false);
                        });
                } else {
                    if (visualStreamRef.current) {
                        visualStreamRef.current.getTracks().forEach(track => track.stop());
                        visualStreamRef.current = null;
                    }
                }

                return () => {
                    if (visualStreamRef.current) {
                        visualStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, [isVisualScanOpen]);

            const handleCaptureAndDetectAi = async () => {
                if (!visualVideoRef.current) return;
                setIsAiLoading(true);
                setAiDetectedName("Menganalisis gambar dengan AI...");

                try {
                    if (!aiModelRef.current) {
                        aiModelRef.current = await mobilenet.load();
                    }

                    const predictions = await aiModelRef.current.classify(visualVideoRef.current);
                    
                    if (predictions && predictions.length > 0) {
                        const topPrediction = predictions[0].className;
                        setAiDetectedName(`AI Memprediksi: "${topPrediction}"`);
                        
                        playBeepSound();

                        const keywords = topPrediction.toLowerCase().split(',').map(k => k.trim());
                        
                        let matchedProduct = null;
                        for (let key of keywords) {
                            matchedProduct = products.find(p => p.name.toLowerCase().includes(key));
                            if (matchedProduct) break;
                        }

                        if (matchedProduct) {
                            setTimeout(() => {
                                addToCart(matchedProduct);
                                setIsVisualScanOpen(false);
                                setIsAiLoading(false);
                                alert(`✨ Visual AI Berhasil! Mengidentifikasi objek "${topPrediction}" dan menambahkan "${matchedProduct.name}" ke keranjang!`);
                            }, 600);
                        } else {
                            setIsAiLoading(false);
                            alert(`Objek terdeteksi "${topPrediction}", tetapi tidak ada produk yang cocok di database toko Anda. Silakan tambahkan produk secara manual.`);
                        }
                    } else {
                        setIsAiLoading(false);
                        setAiDetectedName("Gagal mendeteksi gambar.");
                    }
                } catch (error) {
                    console.error("AI Scan Error:", error);
                    setIsAiLoading(false);
                    setAiDetectedName("Terjadi kesalahan sistem AI.");
                    alert("Gagal menjalankan AI Scan: " + error.message);
                }
            };

            useEffect(() => {
                if (!searchQuery.trim()) {
                    setSearchResults([]);
                    return;
                }
                const q = searchQuery.toLowerCase();
                const filtered = products.filter(p => 
                    (p.name || '').toLowerCase().includes(q) || 
                    (p.barcode || '').includes(q) || 
                    (p.sku || '').toLowerCase().includes(q)
                );
                setSearchResults(filtered);
            }, [searchQuery, products]);

            const lowStockProducts = products.filter(p => p.stock <= p.minStock);
            const expiredSoonProducts = products.filter(p => {
                if (!p.expiredDate) return false;
                const diffDays = Math.ceil((new Date(p.expiredDate) - new Date()) / (1000 * 60 * 60 * 24));
                return diffDays <= 30;
            });

            const handleApplyPreset = (presetKey) => {
                setDatePreset(presetKey);
                const now = new Date();
                
                if (presetKey === 'TODAY') {
                    const todayStr = formatDateLocal(now);
                    setStartDate(todayStr);
                    setEndDate(todayStr);
                } else if (presetKey === 'YESTERDAY') {
                    const yesterday = new Date(now);
                    yesterday.setDate(now.getDate() - 1);
                    const yestStr = formatDateLocal(yesterday);
                    setStartDate(yestStr);
                    setEndDate(yestStr);
                } else if (presetKey === 'LAST_7') {
                    const sevenDaysAgo = new Date(now);
                    sevenDaysAgo.setDate(now.getDate() - 6);
                    setStartDate(formatDateLocal(sevenDaysAgo));
                    setEndDate(formatDateLocal(now));
                } else if (presetKey === 'LAST_30') {
                    const thirtyDaysAgo = new Date(now);
                    thirtyDaysAgo.setDate(now.getDate() - 29);
                    setStartDate(formatDateLocal(thirtyDaysAgo));
                    setEndDate(formatDateLocal(now));
                } else if (presetKey === 'ALL') {
                    setStartDate('');
                    setEndDate('');
                }
            };

            const filteredTransactions = transactions.filter(t => {
                const txDate = formatDateLocal(new Date(t.createdAt));
                if (startDate && txDate < startDate) return false;
                if (endDate && txDate > endDate) return false;
                return true;
            });

            const totalOmzetFilter = filteredTransactions.reduce((acc, t) => acc + t.total, 0);
            const totalHppFilter = filteredTransactions.reduce((acc, t) => acc + (t.totalCost || 0), 0);
            const totalProfitFilter = filteredTransactions.reduce((acc, t) => acc + (t.profit || 0), 0);

            const exportToExcel = () => {
                if (filteredTransactions.length === 0) {
                    alert("Tidak ada data transaksi untuk diekspor!");
                    return;
                }

                const excelData = filteredTransactions.map((t, idx) => ({
                    "No": idx + 1,
                    "No Transaksi": t.transactionNo,
                    "Tanggal & Waktu": new Date(t.createdAt).toLocaleString('id-ID'),
                    "Kasir": t.cashierName || '-',
                    "Pelanggan": t.customerName || '-',
                    "Metode Pembayaran": t.paymentMethod,
                    "Total Omzet (Rp)": t.total,
                    "Total HPP/Modal (Rp)": t.totalCost || 0,
                    "Profit/Keuntungan (Rp)": t.profit || 0,
                    "Jumlah Bayar (Rp)": t.paid,
                    "Kembalian (Rp)": t.change
                }));

                const worksheet = XLSX.utils.json_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Keuangan");

                const fileName = `Laporan_Keuangan_${startDate || 'Semua'}_sd_${endDate || 'Semua'}.xlsx`;
                XLSX.writeFile(workbook, fileName);
            };

            const addToCart = (product) => {
                if (product.stock <= 0) {
                    alert(`Stok "${product.name}" habis, tidak bisa ditambahkan ke keranjang!`);
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(item => item.product.id === product.id);
                    if (existing) {
                        if (existing.qty + 1 > product.stock) {
                            alert(`Stok "${product.name}" tidak mencukupi! Sisa stok: ${product.stock}`);
                            return prev;
                        }
                        return prev.map(item =>
                            item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item
                        );
                    }
                    return [...prev, { product, qty: 1 }];
                });
                setSearchQuery('');
                setSearchResults([]);
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.product.id === id) {
                        const newQty = item.qty + delta;
                        if (delta > 0 && newQty > item.product.stock) {
                            alert(`Stok "${item.product.name}" tidak mencukupi! Sisa stok: ${item.product.stock}`);
                            return item;
                        }
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const grandTotal = cart.reduce((a, b) => a + (b.product.sellingPrice * b.qty), 0);
            const totalCartCost = cart.reduce((a, b) => a + ((b.product.costPrice || 0) * b.qty), 0);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProductForm(prev => ({ ...prev, imageUrl: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddCategory = async () => {
                const trimmedName = newCategoryInput.trim();
                if (!trimmedName) {
                    alert("Nama kategori tidak boleh kosong!");
                    return;
                }
                const exists = categories.find(c => c.name.toLowerCase() === trimmedName.toLowerCase());
                if (exists) {
                    alert(`Kategori "${trimmedName}" sudah ada!`);
                    setProductForm(prev => ({ ...prev, category: exists.name }));
                    setNewCategoryInput('');
                    setIsAddingNewCategory(false);
                    return;
                }
                try {
                    await db.categories.add({ name: trimmedName });
                    await refreshData();
                    setProductForm(prev => ({ ...prev, category: trimmedName }));
                    setNewCategoryInput('');
                    setIsAddingNewCategory(false);
                    handleBackupToFirebase();
                } catch (error) {
                    const handled = await handleDbError(error, 'tambah kategori');
                    if (!handled) {
                        alert("❌ Gagal menambahkan kategori: " + error.message);
                    }
                }
            };

            const handleCompletePayment = async () => {
                const parsedCash = parseFloat(cashPaid);
                const paid = paymentMethod === 'CASH'
                    ? (isNaN(parsedCash) ? grandTotal : parsedCash)
                    : grandTotal;
                if (paymentMethod === 'CASH' && paid < grandTotal) {
                    alert("Jumlah pembayaran kurang!");
                    return;
                }

                const transactionProfit = grandTotal - totalCartCost;

                const newTx = {
                    transactionNo: 'TRX-' + Date.now().toString().slice(-8),
                    items: cart.map(c => ({
                        id: c.product.id,
                        name: c.product.name,
                        costPrice: c.product.costPrice || 0,
                        price: c.product.sellingPrice,
                        qty: c.qty,
                        subtotal: c.product.sellingPrice * c.qty
                    })),
                    total: grandTotal,
                    totalCost: totalCartCost,
                    profit: transactionProfit,
                    paid: paid,
                    change: paid - grandTotal,
                    paymentMethod: paymentMethod,
                    cashierName: cashierInput.trim(),
                    customerName: customerInput.trim(),
                    createdAt: new Date().toISOString()
                };

                await db.transactions.add(newTx);

                for (const item of cart) {
                    const prod = await db.products.get(item.product.id);
                    if (prod) {
                        await db.products.update(item.product.id, { 
                            stock: Math.max(0, prod.stock - item.qty),
                            totalSold: (prod.totalSold || 0) + item.qty,
                            lastSoldDate: new Date().toISOString().split('T')[0]
                        });
                    }
                }

                setLastCompletedTx(newTx);
                setCart([]);
                setIsPaymentModalOpen(false);
                setIsReceiptModalOpen(true);
                setCashPaid('');
                setCustomerInput('');
                await refreshData();
                handleBackupToFirebase();
            };

            const handleOpenProductModal = (product = null) => {
                if (product) {
                    setProductForm(product);
                    setImageInputMode(product.imageUrl && product.imageUrl.startsWith('http') ? 'url' : 'file');
                } else {
                    setProductForm({
                        id: 'PROD-' + Date.now().toString().slice(-6),
                        name: '',
                        sku: 'SKU-' + Math.floor(100 + Math.random() * 900),
                        barcode: Math.floor(100000000000 + Math.random() * 900000000000).toString(),
                        category: categories[0]?.name || 'Makanan',
                        costPrice: 0,
                        sellingPrice: 0,
                        stock: 10,
                        minStock: 5,
                        expiredDate: '',
                        imageUrl: ''
                    });
                    setImageInputMode('file');
                }
                setIsProductModalOpen(true);
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!productForm.name || !productForm.name.trim()) {
                    alert("Nama produk wajib diisi!");
                    return;
                }
                if (productForm.costPrice === '' || productForm.costPrice === null || isNaN(parseFloat(productForm.costPrice))) {
                    alert("Harga Modal (HPP) wajib diisi dengan angka!");
                    return;
                }
                if (productForm.sellingPrice === '' || productForm.sellingPrice === null || isNaN(parseFloat(productForm.sellingPrice))) {
                    alert("Harga Jual wajib diisi dengan angka!");
                    return;
                }

                try {
                    await db.products.put({
                        ...productForm,
                        costPrice: parseFloat(productForm.costPrice) || 0,
                        sellingPrice: parseFloat(productForm.sellingPrice) || 0,
                        stock: parseInt(productForm.stock) || 0,
                        minStock: parseInt(productForm.minStock) || 0,
                        totalSold: productForm.totalSold || 0,
                        lastSoldDate: productForm.lastSoldDate || '-'
                    });

                    setIsProductModalOpen(false);
                    await refreshData();
                    handleBackupToFirebase();
                    alert("Produk berhasil disimpan!");
                } catch (error) {
                    const handled = await handleDbError(error, 'simpan produk');
                    if (!handled) {
                        alert("❌ Gagal menyimpan produk: " + error.message);
                    }
                }
            };

            const handleDeleteProduct = async (id) => {
                if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
                    await db.products.delete(id);
                    await refreshData();
                    handleBackupToFirebase();
                }
            };

                            }]
                        },

                    });

                    const sortedTop = [...products].sort((a, b) => b.totalSold - a
