        function processImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            let cleanUrl = url.trim();

            if (!cleanUrl) return '';

            if (cleanUrl.startsWith('data:image/')) {
                return cleanUrl;
            }

            if (cleanUrl.includes('drive.google.com') && cleanUrl.includes('/file/d/')) {
                const idMatch = cleanUrl.match(/\/file\/d\/([^\/]+)/);
                if (idMatch && idMatch[1]) {
                    cleanUrl = `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
                }
            }

            if (cleanUrl.includes('dropbox.com')) {
                cleanUrl = cleanUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
            }

            if (cleanUrl.startsWith('http://')) {
                cleanUrl = cleanUrl.replace('http://', 'https://');
            }

            return cleanUrl;
        }

        function ProductImage({ src, alt, className }) {
            const [imgState, setImgState] = useState('loading');
            const [currentSrc, setCurrentSrc] = useState('');

            useEffect(() => {
                const processed = processImageUrl(src);
                if (!processed) {
                    setImgState('empty');
                    return;
                }
                setCurrentSrc(processed);
                setImgState('loading');
            }, [src]);

            const handleError = () => {
                if (imgState === 'loading' && currentSrc && !currentSrc.startsWith('data:')) {
                    const rawUrl = currentSrc.replace(/^https?:\/\//, '');
                    setCurrentSrc(`https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}`);
                    setImgState('proxy');
                } else {
                    setImgState('error');
                }
            };

            if (imgState === 'empty' || imgState === 'error') {
                return (
                    <div className={`flex items-center justify-center bg-slate-900 text-slate-500 ${className}`}>
                        <i data-lucide="package" className="w-8 h-8 opacity-60"></i>
                    </div>
                );
            }

            return (
                <img 
                    src={currentSrc} 
                    alt={alt || "Foto Produk"} 
                    className={`${className} object-cover`}
                    onLoad={() => setImgState('success')}
                    onError={handleError}
                />
            );
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio AudioContext error:", e);
            }
        }

        function resetLocalDatabase() {
            try { db.close(); } catch (e) {}
            return new Promise((resolve, reject) => {
                const req = indexedDB.deleteDatabase("VeloPOSProDB");
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
                req.onblocked = () => resolve();
            });
        }

                    "Klik Cancel untuk membatalkan."
                );
                if (confirmReset) {
                    try {
                        await resetLocalDatabase();
                        window.location.reload();
                    } catch (resetError) {
                        alert("❌ Gagal mereset database: " + resetError.message);
                    }
                }
                return true;
            }
            return false;
        }

                        const currentIndex = availableUnits.findIndex(u => selectedUnitObj && u.name === selectedUnitObj.name);

                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            const nextIndex = (currentIndex < availableUnits.length - 1) ? currentIndex + 1 : 0;
                            setSelectedUnitObj(availableUnits[nextIndex]);
                            return;
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            e.preventDefault();
                            const prevIndex = (currentIndex > 0) ? currentIndex - 1 : availableUnits.length - 1;
                            setSelectedUnitObj(availableUnits[prevIndex]);
                            return;
                        } else if (e.key === 'Enter') {

                        const isTypingInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);
                        const isSearchFocused = searchInputElem && document.activeElement === searchInputElem;

                        const upperChar = e.key ? e.key.toUpperCase() : '';

                        if (upperChar === 'F') {
                            e.preventDefault();
                            if (searchInputElem) {
                                searchInputElem.focus();
                                searchInputElem.select();
                            }

                        }

                    isi: parseInt(u.isi) || 1,
                    costPrice: parseFloat(u.costPrice) || (baseCost * (parseInt(u.isi) || 1)),
                    sellingPrice: parseFloat(u.sellingPrice) || (baseSell * (parseInt(u.isi) || 1))
                })) : [
                    { name: 'Pcs', isi: 1, costPrice: baseCost, sellingPrice: baseSell }
                ];

                try {
                    await db.products.put({
                        ...productForm,
                        costPrice: baseCost,
                        sellingPrice: baseSell,
                        stock: parseInt(productForm.stock) || 0,
                        minStock: parseInt(productForm.minStock) || 0,
                        totalSold: productForm.totalSold || 0,
                        lastSoldDate: productForm.lastSoldDate || '-',
                        units: processedUnits
                    });

                    setIsProductModalOpen(false);
                    await refreshData();
                    handleBackupToFirebase();
                    alert("Produk berhasil disimpan!");
                } catch (error) {
                    const handled = await handleDbError(error, 'simpan produk');
                    if (!handled) {
                        alert("❌ Gagal menyimpan produk: " + error.message);
                    }
                }
            };

            const handleDeleteProduct = async (id) => {
                if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
                    await db.products.delete(id);
                    await refreshData();
                    handleBackupToFirebase();
                }
            };

            useEffect(() => {
                if (activeTab === 'dashboard' && salesChartRef.current && topProductsChartRef.current) {
                    if (chartInstanceRef.current.sales) chartInstanceRef.current.sales.destroy();
                    if (chartInstanceRef.current.top) chartInstanceRef.current.top.destroy();

                    const dayLabels = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                    const last7 = [];
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        last7.push({ dateStr: formatDateLocal(d), label: dayLabels[d.getDay()] });
                    }
                    const salesByDay = last7.map(({ dateStr }) =>
                        transactions
                            .filter(t => formatDateLocal(new Date(t.createdAt)) === dateStr)
                            .reduce((acc, t) => acc + t.total, 0)
                    );

                    const ctxSales = salesChartRef.current.getContext('2d');
                    chartInstanceRef.current.sales = new Chart(ctxSales, {
                        type: 'line',
                        data: {
                            labels: last7.map(x => x.label),
                            datasets: [{
                                label: 'Penjualan (Rp)',
                                data: salesByDay,
                                borderColor: '#818cf8',
                                backgroundColor: 'rgba(99, 102, 241, 0.15)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });

                    const sortedTop = [...products].sort((a, b) => b.totalSold - a.totalSold).slice(0, 5);
                    const ctxTop = topProductsChartRef.current.getContext('2d');
                    chartInstanceRef.current.top = new Chart(ctxTop, {
                        type: 'bar',
                        data: {
                            labels: sortedTop.map(p => p.name.length > 12 ? p.name.slice(0, 12) + '...' : p.name),
                            datasets: [{
                                label: 'Terjual (Pcs)',
                                data: sortedTop.map(p => p.totalSold),
                                backgroundColor: '#10b981'
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
            }, [activeTab, products, transactions]);

            useEffect(() => {
                setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
            });

            return (
                <div className="flex flex-col md:flex-row h-screen w-screen overflow-hidden bg-slate-950 text-white">
                    
                    <aside className="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800/80 p-4 justify-between">
                        <div>
                            <div className="flex items-center gap-3 px-2 py-3 mb-6">
                                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/30 text-white">
                                    V
                                </div>
                                <div>
                                    <h1 className="font-bold text-white text-base leading-none">VeloPOS Pro</h1>
                                    <span className="text-[10px] text-emerald-400 font-semibold">● Firebase Connected</span>
                                </div>
                            </div>

                            <nav className="space-y-1.5">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="layout-dashboard" className="w-5 h-5"></i> Dashboard
                                </button>
                                <button onClick={() => setActiveTab('pos')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition ${activeTab === 'pos' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="shopping-cart" className="w-5 h-5"></i> POS Kasir
                                </button>
                                <button onClick={() => setActiveTab('products')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition ${activeTab === 'products' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="box" className="w-5 h-5"></i> Produk
                                </button>
                                <button onClick={() => setActiveTab('reports')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition ${activeTab === 'reports' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="file-text" className="w-5 h-5"></i> Laporan
                                </button>
                                <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="settings" className="w-5 h-5"></i> Setting
                                </button>
                            </nav>
                        </div>

                        <div className="space-y-3">
                            <button 
                                onClick={handleBackupToFirebase}
                                disabled={isBackingUp}
                                className="w-full py-2.5 px-3 bg-indigo-600/20 hover:bg-indigo-600 border border-indigo-500/50 hover:border-indigo-500 text-indigo-300 hover:text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition shadow"
                            >
                                <i data-lucide="cloud-upload" className="w-4 h-4"></i> 
                                {isBackingUp ? 'Memproses Backup...' : 'Backup ke Firebase'}
                            </button>

                            {lastBackupTime && (
                                <p className="text-[10px] text-slate-400 text-center font-semibold">
                                    Backup Terakhir:<br/>{lastBackupTime}
                                </p>
                            )}

                            {lowStockProducts.length > 0 && (
                                <div className="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300 font-semibold flex items-center gap-2">
                                    <span>⚠️</span> <span>{lowStockProducts.length} Produk Stok Habis</span>
                                </div>
                            )}
                            {expiredSoonProducts.length > 0 && (
                                <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300 font-semibold flex items-center gap-2">
                                    <span>⌛</span> <span>{expiredSoonProducts.length} Produk Mau Expired</span>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        
                        {activeTab === 'dashboard' && (
                            <div className="p-4 md:p-6 overflow-y-auto space-y-6 pb-24 md:pb-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-white">Dashboard Penjualan</h2>
                                    <button 
                                        onClick={handleBackupToFirebase}
                                        disabled={isBackingUp}
                                        className="md:hidden px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"
                                    >
                                        <i data-lucide="cloud-upload" className="w-4 h-4"></i> Backup
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md">
                                        <p className="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Omzet</p>
                                        <p className="text-lg md:text-xl font-black text-indigo-300 mt-1 tabular-nums whitespace-nowrap overflow-hidden text-ellipsis">
                                            Rp {transactions.reduce((acc, t) => acc + t.total, 0).toLocaleString('id-ID')}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md">
                                        <p className="text-xs text-slate-400 uppercase font-bold tracking-wider">Total HPP (Modal)</p>
                                        <p className="text-lg md:text-xl font-black text-amber-300 mt-1 tabular-nums whitespace-nowrap overflow-hidden text-ellipsis">
                                            Rp {transactions.reduce((acc, t) => acc + (t.totalCost || 0), 0).toLocaleString('id-ID')}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md">
                                        <p className="text-xs text-slate-400 uppercase font-bold tracking-wider">Profit (Keuntungan)</p>
                                        <p className="text-lg md:text-xl font-black text-emerald-300 mt-1 tabular-nums whitespace-nowrap overflow-hidden text-ellipsis">
                                            Rp {transactions.reduce((acc, t) => acc + (t.profit || 0), 0).toLocaleString('id-ID')}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-md">
                                        <p className="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Transaksi</p>
                                        <p className="text-lg md:text-xl font-black text-sky-300 mt-1 tabular-nums whitespace-nowrap">{transactions.length} TRX</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl h-72">
                                        <h3 className="text-sm font-bold text-white mb-3">Grafik Penjualan Harian</h3>
                                        <div className="h-56">
                                            <canvas ref={salesChartRef}></canvas>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl h-72">
                                        <h3 className="text-sm font-bold text-white mb-3">Grafik Produk Terlaris</h3>
                                        <div className="h-56">
                                            <canvas ref={topProductsChartRef}></canvas>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-slate-900 border border-amber-500/30 p-4 rounded-2xl shadow-lg">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-sm font-bold text-amber-300 flex items-center gap-2">
                                                <span>⚠️</span> Barang Stok Menipis (Perlu Dibelanjakan)
                                            </h3>
                                            <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold border border-amber-500/30">
                                                {lowStockProducts.length} Barang
                                            </span>
                                        </div>

                                        <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                                            {lowStockProducts.length === 0 ? (
                                                <p className="text-xs text-slate-400 text-center py-6 font-semibold">Semua stok barang aman/mencukupi 👍</p>
                                            ) : (
                                                lowStockProducts.map(p => (
                                                    <div key={p.id} className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center text-xs">
                                                        <div>
                                                            <p className="font-bold text-white">{p.name}</p>
                                                            <p className="text-[10px] text-slate-400">Min. Stok: {p.minStock} Pcs | SKU: {p.sku}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-xs font-black text-amber-300 bg-amber-500/20 px-2 py-1 rounded-md border border-amber-500/30 inline-block">
                                                                Sisa {p.stock} Pcs
                                                            </span>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-rose-500/30 p-4 rounded-2xl shadow-lg">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-sm font-bold text-rose-300 flex items-center gap-2">
                                                <span>⌛</span> Barang Mendekati Kadaluwarsa (Expired)
                                            </h3>
                                            <span className="text-xs bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full font-bold border border-rose-500/30">
                                                {expiredSoonProducts.length} Barang
                                            </span>
                                        </div>

                                        <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                                            {expiredSoonProducts.length === 0 ? (
                                                <p className="text-xs text-slate-400 text-center py-6 font-semibold">Tidak ada barang yang mendekati expired 👍</p>
                                            ) : (
                                                expiredSoonProducts.map(p => {
                                                    const diffDays = Math.ceil((new Date(p.expiredDate) - new Date()) / (1000 * 60 * 60 * 24));
                                                    return (
                                                        <div key={p.id} className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center text-xs">
                                                            <div>
                                                                <p className="font-bold text-white">{p.name}</p>
                                                                <p className="text-[10px] text-slate-400">Tgl Exp: <span className="text-rose-300 font-bold">{p.expiredDate}</span></p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="text-xs font-black text-rose-300 bg-rose-500/20 px-2 py-1 rounded-md border border-rose-500/30 inline-block">
                                                                    {diffDays <= 0 ? 'Sudah Expired' : `${diffDays} Hari Lagi`}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <h3 className="text-sm font-bold text-emerald-300 mb-3">🔥 Produk Terlaris (Fast Moving)</h3>
                                        <div className="space-y-2">
                                            {[...products].sort((a,b) => b.totalSold - a.totalSold).slice(0,3).map(p => (
                                                <div key={p.id} className="flex justify-between items-center p-2.5 bg-slate-950 rounded-xl text-xs">
                                                    <span className="font-bold text-white pr-2 truncate">{p.name}</span>
                                                    <span className="text-emerald-300 font-extrabold shrink-0 whitespace-nowrap">{p.totalSold} Terjual</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <h3 className="text-sm font-bold text-rose-300 mb-3">💤 Produk Paling Lama Tidak Terjual (Slow Moving)</h3>
                                        <div className="space-y-2">
                                            {[...products].sort((a,b) => a.totalSold - b.totalSold).slice(0,3).map(p => (
                                                <div key={p.id} className="flex justify-between items-center p-2.5 bg-slate-950 rounded-xl text-xs">
                                                    <div className="pr-2 truncate">
                                                        <p className="font-bold text-white truncate">{p.name}</p>
                                                        <p className="text-[10px] text-slate-400">Terakhir: {p.lastSoldDate}</p>
                                                    </div>
                                                    <span className="text-rose-300 font-extrabold shrink-0 whitespace-nowrap">{p.totalSold} Terjual</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="flex flex-col lg:flex-row h-full overflow-hidden pb-16 md:pb-0">
                                
                                <div className="flex-1 flex flex-col p-4 overflow-hidden">
                                    
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        <button onClick={() => { if (cartRef.current.length > 0) handleVoidCartItem(cartRef.current[cartRef.current.length - 1].cartId); }} title="Delete [D]" className="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            🗑️ Delete [D]
                                        </button>
                                        <button onClick={handleCancelTransaction} title="Batal [X]" className="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            ❌ Batal [X]
                                        </button>
                                        <button onClick={() => { if (cartRef.current.length > 0) handleOpenEditPrice(cartRef.current[cartRef.current.length - 1]); }} title="Ubah Harga [H]" className="px-3 py-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            💰 Ubah Harga [H]
                                        </button>
                                        <button onClick={() => { if (cartRef.current.length > 0) handleOpenEditQty(cartRef.current[cartRef.current.length - 1]); }} title="Ubah Qty [Q]" className="px-3 py-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            📦 Ubah Qty [Q]
                                        </button>
                                        <button onClick={() => setIsReprintModalOpen(true)} title="Reprint [R]" className="px-3 py-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            🖨️ Reprint [R]
                                        </button>
                                        <button onClick={handlePauseTransaction} title="Jeda [J]" className="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            ⏸️ Jeda [J]
                                        </button>
                                        <button onClick={() => setIsPausedListModalOpen(true)} title="Jeda List [L]" className="px-3 py-1.5 bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            📂 Jeda List ({pausedTransactions.length}) [L]
                                        </button>
                                        <button onClick={() => { const s = document.getElementById('pos-search-input'); if (s) { s.focus(); s.select(); } }} title="Cari Item [F]" className="px-3 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            🔍 Cari Item [F]
                                        </button>
                                        <button onClick={() => { if (cartRef.current.length > 0) setIsPaymentModalOpen(true); }} title="Bayar [B]" className="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-[11px] font-bold flex items-center gap-1 transition">
                                            💵 Bayar [B]
                                        </button>
                                    </div>

                                    <div className="relative mb-4 flex gap-2">
                                        <div className="relative flex-1">
                                            <input 
                                                id="pos-search-input"
                                                type="text"
                                                placeholder="Ketik nama, barcode, atau SKU [Tekan F] (Gunakan Panah Atas/Bawah & Enter)..."
                                                value={searchQuery}
                                                onChange={e => setSearchQuery(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700/80 rounded-2xl pl-11 pr-4 py-3 text-white font-semibold placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-inner"
                                            />
                                            <i data-lucide="search" className="absolute left-3.5 top-3.5 w-4 h-4 text-slate-300"></i>
                                        </div>

                                        <button 
                                            onClick={() => setIsScannerOpen(!isScannerOpen)}
                                            className={`px-3.5 py-3 border text-xs font-bold rounded-2xl flex items-center gap-1.5 transition shadow ${isScannerOpen ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-900 border-slate-700 text-indigo-300 hover:border-indigo-500'}`}
                                        >
                                            <i data-lucide="barcode" className="w-4 h-4"></i> Barcode
                                        </button>

                                        <button 
                                            onClick={() => setIsVisualScanOpen(true)}
                                            className="px-3.5 py-3 bg-slate-900 border border-slate-700 text-indigo-300 hover:border-indigo-500 hover:text-white rounded-2xl flex items-center gap-1.5 text-xs font-bold transition shadow"
                                        >
                                            <i data-lucide="camera" className="w-4 h-4"></i> Visual Scan AI
                                        </button>
                                    </div>

                                    {isScannerOpen && (
                                        <div className="mb-4 bg-slate-900 p-3 rounded-2xl border border-indigo-500/50 shadow-2xl relative">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> 
                                                    Arahkan Kamera ke Barcode Produk
                                                </span>
                                                <button onClick={() => setIsScannerOpen(false)} className="text-xs bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white px-2.5 py-1 rounded-lg font-bold transition">Tutup Kamera</button>
                                            </div>
                                            <div id="reader" className="overflow-hidden rounded-xl h-52 bg-slate-950 border border-slate-800"></div>
                                        </div>
                                    )}

                                    {searchResults.length > 0 && (
                                        <div className="mb-4 bg-slate-900 border border-slate-700 rounded-2xl max-h-60 overflow-y-auto shadow-2xl z-40">
                                            {searchResults.map((prod, index) => (
                                                <div 
                                                    key={prod.id}
                                                    onClick={() => triggerUnitSelection(prod)}
                                                    onMouseEnter={() => setSelectedSearchIndex(index)}
                                                    className={`p-3 border-b border-slate-800 last:border-none cursor-pointer flex justify-between items-center transition ${
                                                        selectedSearchIndex === index 
                                                            ? 'bg-indigo-600/40 border-l-4 border-l-indigo-400' 
                                                            : 'hover:bg-indigo-600/30'
                                                    }`}
                                                >
                                                    <div className="pr-2 truncate">
                                                        <p className="font-bold text-sm text-white truncate">
                                                            {selectedSearchIndex === index && <span className="text-indigo-300 mr-1.5">▶</span>}
                                                            {prod.name}
                                                        </p>
                                                        <p className="text-xs text-slate-400">SKU: {prod.sku} | Barcode: {prod.barcode} | Stok: {prod.stock}</p>
                                                    </div>
                                                    <span className="text-indigo-300 font-black text-xs sm:text-sm whitespace-nowrap shrink-0 ml-2">Rp {prod.sellingPrice.toLocaleString('id-ID')}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="flex-1 overflow-y-auto pr-1">
                                        <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                                            {products.map(prod => (
                                                <div 
                                                    key={prod.id}

                                                            type="text" 
                                                            placeholder="Nama Satuan (Cth: Dus)"

                                                key={m} 
                                                onClick={() => setPaymentMethod(m)} 
                                                className={`py-2 rounded-xl text-xs font-extrabold border transition ${paymentMethod === m ? 'bg-indigo-600 border-indigo-500 text-white shadow-md' : 'bg-slate-950 border-slate-800 text-slate-400'}`}
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {paymentMethod === 'CASH' && (
                                    <div>
                                        <label className="text-xs text-slate-300 font-bold">Uang Diterima (Rp)</label>
                                        <input 
                                            type="number" 
                                            placeholder={grandTotal.toString()}
                                            value={cashPaid}
                                            onChange={e => setCashPaid(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-black text-lg sm:text-xl tabular-nums mt-1"
                                        />
                                    </div>
                                )}

                                <div className="p-3.5 bg-slate-950 rounded-xl space-y-1.5 text-xs border border-slate-800">
                                    <div className="flex justify-between items-center text-slate-300 font-semibold gap-2">
                                        <span>Total Tagihan:</span>
                                        <span className="font-black text-indigo-300 text-xs sm:text-sm tabular-nums whitespace-nowrap shrink-0">Rp {grandTotal.toLocaleString('id-ID')}</span>
                                    </div>
                                    {paymentMethod === 'CASH' && (
                                        <div className="flex justify-between items-center text-slate-300 font-semibold gap-2">
                                            <span>Kembalian:</span>
                                            <span className="font-black text-emerald-300 text-xs sm:text-sm tabular-nums whitespace-nowrap shrink-0">
                                                Rp {Math.max(0, (isNaN(parseFloat(cashPaid)) ? grandTotal : parseFloat(cashPaid)) - grandTotal).toLocaleString('id-ID')}
                                            </span>
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setIsPaymentModalOpen(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Batal</button>
                                    <button onClick={handleCompletePayment} className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30">Selesaikan & Cetak</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isReceiptModalOpen && lastCompletedTx && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-white text-sm text-center">Struk Transaksi Minimarket</h3>
                                
                                <div id="receipt-print-area" className="bg-white text-black p-4 rounded-2xl receipt-font text-[11.5px] space-y-3 font-black shadow-inner">
                                    <div className="text-center pb-2 border-b-2 border-dashed border-black">
                                        <p className="text-sm sm:text-base uppercase tracking-wider font-black">{storeInfo.storeName || 'VELO MART MINIMARKET'}</p>
                                        <p className="font-black text-[10.5px] text-black mt-0.5">{storeInfo.address}</p>
                                        {storeInfo.phone && <p className="font-black text-[10.5px] text-black">Telp: {storeInfo.phone}</p>}
                                    </div>

                                    <div className="space-y-0.5 text-[10.5px] pb-2 border-b-2 border-dashed border-black font-black text-black">
                                        <div className="flex justify-between">
                                            <span>No. TRX</span>
                                            <span>{lastCompletedTx.transactionNo}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Waktu</span>
                                            <span>{new Date(lastCompletedTx.createdAt).toLocaleString('id-ID')}</span>
                                        </div>
                                        {lastCompletedTx.cashierName && (
                                            <div className="flex justify-between">
                                                <span>Kasir</span>
                                                <span>{lastCompletedTx.cashierName}</span>
                                            </div>
                                        )}
                                        {lastCompletedTx.customerName && (
                                            <div className="flex justify-between">
                                                <span>Pelanggan</span>
                                                <span>{lastCompletedTx.customerName}</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-2 pb-2 border-b-2 border-dashed border-black text-[11.5px]">
                                        {lastCompletedTx.items.map((item, i) => (
                                            <div key={i} className="space-y-0.5">
                                                <p className="font-black text-black leading-snug">{item.name}</p>
                                                <div className="flex justify-between items-center text-[10.5px] text-black font-black pl-1">
                                                    <span>{item.qty} x {item.price.toLocaleString('id-ID')}</span>
                                                    <span>Rp {item.subtotal.toLocaleString('id-ID')}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="space-y-1 pt-1 text-[11.5px] font-black text-black">
                                        <div className="flex justify-between items-center text-xs">
                                            <span>TOTAL</span>
                                            <span className="text-sm">Rp {lastCompletedTx.total.toLocaleString('id-ID')}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-[10.5px] font-black text-black">
                                            <span>BAYAR ({lastCompletedTx.paymentMethod})</span>
                                            <span>Rp {lastCompletedTx.paid.toLocaleString('id-ID')}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-[10.5px] font-black text-black">
                                            <span>KEMBALI</span>
                                            <span>Rp {lastCompletedTx.change.toLocaleString('id-ID')}</span>
                                        </div>
                                    </div>

                                    <div className="text-center pt-3 border-t-2 border-dashed border-black text-[10.5px] text-black font-black">
                                        <p className="whitespace-pre-line leading-relaxed">{storeInfo.receiptFooter}</p>
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => window.print()} className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1 shadow-lg shadow-indigo-600/30">
                                        <i data-lucide="printer" className="w-4 h-4"></i> Cetak Struk
                                    </button>
                                    <button onClick={() => setIsReceiptModalOpen(false)} className="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold">
                                        Selesai
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
